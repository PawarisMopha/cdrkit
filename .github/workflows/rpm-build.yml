name: RPM Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: rockylinux:8

    steps:
    - uses: actions/checkout@v4

    - name: Enable PowerTools repository (required for some -devel packages)
      run: |
        dnf install -y dnf-plugins-core
        dnf config-manager --set-enabled powertools

    - name: Install build dependencies
      run: |
        dnf groupinstall -y "Development Tools"
        dnf install -y \
          bzip2-devel \
          cmake \
          libcap-devel \
          zlib-devel \
          rpm-build \
          rpmdevtools \
          wget

    - name: Set up RPM build environment
      run: |
        rpmdev-setuptree

    - name: Copy spec file and patches
      run: |
        cp cdrkit.spec ~/rpmbuild/SPECS/
        cp *.patch ~/rpmbuild/SOURCES/ 2>/dev/null || true

    - name: Download cdrkit source
      run: |
        cd ~/rpmbuild/SOURCES
        wget -q http://cdrkit.org/releases/cdrkit-1.1.11.tar.gz

    - name: Build RPM package (ignoring cdparanoia/libcdio dependencies)
      run: |
        cd ~/rpmbuild
        rpmbuild -ba SPECS/cdrkit.spec --nodeps || true

    - name: List build results
      run: |
        find ~/rpmbuild -name "*.rpm" -type f || echo "No RPMs built"

    - name: Upload build artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: rpm-build-results
        path: ~/rpmbuild/RPMS/
        retention-days: 30

    - name: Show build errors
      if: failure()
      run: |
        echo "=== Build Log ===" 
        cat ~/rpmbuild/BUILD/cdrkit-*/build.log 2>/dev/null || echo "No build log found"
