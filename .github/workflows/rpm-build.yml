name: RPM Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: rockylinux:8

    steps:
    - uses: actions/checkout@v4

    - name: Enable PowerTools repository
      run: |
        dnf install -y dnf-plugins-core
        dnf config-manager --set-enabled powertools

    - name: Update and install development tools
      run: |
        dnf groupinstall -y "Development Tools"
        dnf install -y \
          bzip2-devel \
          cmake \
          libcap-devel \
          zlib-devel \
          rpm-build \
          rpmdevtools \
          wget \
          file-devel

    - name: Set up RPM build environment
      run: |
        rpmdev-setuptree

    - name: Copy spec file and patches
      run: |
        cp cdrkit.spec ~/rpmbuild/SPECS/
        cp *.patch ~/rpmbuild/SOURCES/ 2>/dev/null || true

    - name: Download cdrkit source
      run: |
        cd ~/rpmbuild/SOURCES
        wget http://cdrkit.org/releases/cdrkit-1.1.11.tar.gz || echo "Download failed, continuing..."

    - name: Build RPM package
      run: |
        cd ~/rpmbuild
        rpmbuild -ba SPECS/cdrkit.spec --nodeps 2>&1 || true

    - name: List all files in rpmbuild
      run: |
        find ~/rpmbuild -type f -name "*.rpm" 2>/dev/null || echo "Checking for build outputs..."
        ls -la ~/rpmbuild/RPMS/ 2>/dev/null || echo "RPMS directory not found or empty"
        ls -la ~/rpmbuild/SRPMS/ 2>/dev/null || echo "SRPMS directory not found or empty"

    - name: Show build output
      if: always()
      run: |
        echo "=== Build Log ===" 
        find ~/rpmbuild/BUILD -name "build.log" -exec cat {} \; 2>/dev/null || echo "No build log found"
        echo "=== Checking BUILD directory ===" 
        ls -la ~/rpmbuild/BUILD/ 2>/dev/null || echo "BUILD directory empty"

    - name: Upload RPM artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: rpm-build-results
        path: |
          ~/rpmbuild/RPMS/
          ~/rpmbuild/SRPMS/
        retention-days: 30
        if-no-files-found: warn
